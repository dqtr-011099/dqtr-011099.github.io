<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Beauty Mall A/B Testing</title>
    <style>
        /* 미니멀리즘 스타일 및 가독성 중심 기본 설정 */
        body {
            font-family: 'Malgun Gothic', apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
        }

        /* 상품 중심의 역동적인 메인 배너 구역 */
        .banner-container {
            position: relative;
            width: 100%;
            height: 540px; 
            overflow: hidden;
            background-color: #f5f5f5;
        }

        /* 슬라이더 좌우 무한 반복 애니메이션 설정 */
        .banner-slider {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slideAnimation 15s infinite ease-in-out;
        }

        .slide {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* [💡 ĐÃ CẬP NHẬT] Gọi trực tiếp 3 file ảnh bạn sẽ tải lên GitHub */
        .slide1 { background-image: url('banner1.png'); }
        .slide2 { background-image: url('banner2.png'); }
        .slide3 { background-image: url('banner3.png'); }

        /* 슬라이드 애니메이션 프레임 정의 */
        @keyframes slideAnimation {
            0%, 28% { transform: translateX(0); }
            33%, 61% { transform: translateX(-33.33%); }
            66%, 95% { transform: translateX(-66.66%); }
            100% { transform: translateX(0); }
        }

        /* 메인 콘텐츠 영역 및 공중 부양 바우처 박스 */
        .content-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        .voucher-box {
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 20px;
            padding: 45px 35px;
            display: inline-block;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            max-width: 540px;
            width: 100%;
            margin-top: -100px; /* 배너 위로 부드럽게 겹치도록 설정 */
            position: relative;
            z-index: 10;
        }

        .voucher-badge {
            background-color: #f43142; /* 하이라이트 레드 */
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }

        .voucher-box h3 {
            font-size: 28px;
            margin: 0 0 12px 0;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .voucher-box p {
            color: #666666;
            margin-bottom: 30px;
            font-size: 16px;
            font-weight: 400;
        }

        /* 시각적 몰입감을 극대화한 초강력 하이라이트 버튼 디자인 */
        .btn-register {
            background: linear-gradient(135deg, #93b93a 0%, #7da22a 100%);
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            padding: 18px 45px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            text-decoration: none;
            width: 85%;
            box-shadow: 0 6px 20px rgba(147, 185, 58, 0.5);
            animation: pulseGlow 2s infinite; /* 시선 집중을 위한 버튼 자체 발광 애니메이션 */
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #f43142 0%, #e01f30 100%);
            box-shadow: 0 8px 25px rgba(244, 49, 66, 0.6);
            transform: translateY(-4px) scale(1.02);
        }

        /* 버튼 주목도를 대폭 높이는 펄스 효과 기법 */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(147, 185, 58, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(147, 185, 58, 0); }
            100% { box-shadow: 0 0 0 0 rgba(147, 185, 58, 0); }
        }

        /* 베스트셀러 상품 그리드 */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 35px;
            margin-top: 50px;
            text-align: left;
        }

        .product-card {
            border: 1px solid #eaeaea;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            background: #fff;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        .product-img {
            height: 280px;
            background-color: #f5f5f5;
            background-size: cover;
            background-position: center;
        }

        .product-info {
            padding: 20px;
        }

        .product-brand {
            font-size: 13px;
            color: #93b93a;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 16px;
            margin: 5px 0 12px 0;
            font-weight: 500;
            color: #222222;
            height: 44px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-weight: 800;
            color: #f43142;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 이미지 전용 슬라이드 배너 구역 -->
    <div class="banner-container">
        <div class="banner-slider">
            <div class="slide slide1"></div>
            <div class="slide slide2"></div>
            <div class="slide slide3"></div>
        </div>
    </div>

    <!-- 페이지 세부 본문 영역 -->
    <div class="content-section">
        
        <!-- 전환 유도를 위한 강조형 회원가입 바우처 모듈 -->
        <div class="voucher-box">
            <div class="voucher-badge">WELCOME BENEFIT</div>
            <h3>신규 회원가입 혜택</h3>
            <p>지금 가입하시면 K-Beauty 전 상품 즉시 사용 가능한 10% 할인 쿠폰을 드립니다</p>
            <button class="btn-register" onclick="alert('회원가입이 완료되었습니다! 발급된 쿠폰 코드: KTREND10')">
                지금 가입하고 10% 쿠폰 받기
            </button>
        </div>

        <!-- 상품 리스트 그리드 세션 -->
        <h2 style="margin-top: 70px; text-align: left; font-size: 26px; font-weight: 800; border-bottom: 2px solid #111; padding-bottom: 12px;">실시간 베스트셀러</h2>
        <div class="products-grid">
            
            <!-- 상품 카드 1 -->
            <div class="product-card">
                <div class="product-img" style="background-image: url('banner2.png');"></div>
                <div class="product-info">
                    <div class="product-brand">ROMAND</div>
                    <div class="product-title">쥬시 래스팅 틴트 탕후루 광택 롱래스팅 컬러</div>
                    <div class="product-price">13,000 원</div>
                </div>
            </div>

            <!-- 상품 카드 2 -->
            <div class="product-card">
                <div class="product-img" style="background-image: url('banner1.png');"></div>
                <div class="product-info">
                    <div class="product-brand">CLIO</div>
                    <div class="product-title">킬커버 메쉬 글로우 쿠션 기획 세트</div>
                    <div class="product-price">32,000 원</div>
                </div>
            </div>

            <!-- 상품 카드 3 -->
            <div class="product-card">
                <div class="product-img" style="background-image: url('banner3.png');"></div>
                <div class="product-info">
                    <div class="product-brand">PERIPERA</div>
                    <div class="product-title">맑게 물든 커스텀 치크 (페리페라 X CU 콜라보)</div>
                    <div class="product-price">12,000 원</div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>

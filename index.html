<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Beauty Mall A/B Testing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        /* Banner */
        .banner-container {
            width: 100%;
            height: 480px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .banner-slider {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slideAnimation 15s infinite ease-in-out;
        }

        .slide {
            flex: 0 0 33.3333%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slide1 {
            background-image: url('./banner%201.png');
        }

        .slide2 {
            background-image: url('./banner%202.png');
        }

        .slide3 {
            background-image: url('./banner%203.png');
        }

        @keyframes slideAnimation {
            0%, 28% {
                transform: translateX(0);
            }

            33%, 61% {
                transform: translateX(-33.3333%);
            }

            66%, 95% {
                transform: translateX(-66.6667%);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* Main content */
        .content-section {
            max-width: 1240px;
            margin: 0 auto;
            padding: 30px 20px 40px;
        }

        .section-title {
            margin: 0;
            text-align: left;
            font-size: 24px;
            font-weight: 800;
            border-bottom: 2px solid #111;
            padding-bottom: 12px;
        }

        /* Product grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .product-card {
            min-width: 0;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        /* Product images */
        .product-img {
            width: 10%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f7;
            overflow: hidden;
        }

        .product-img img {
            display: block;
            width: 10%;
height: 10%;
            object-fit: contain;
            object-position: center;
        }

        .product-info {
            padding: 15px;
        }

        .product-brand {
            font-size: 13px;
            color: #f43142;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 14px;
            margin: 5px 0 12px;
            font-weight: 500;
            color: #222;
            min-height: 60px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-weight: 800;
            color: #f43142;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .banner-container {
                height: 360px;
            }
        }

        @media (max-width: 560px) {
            .products-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .banner-container {
                height: 240px;
            }

            .content-section {
                padding: 24px 14px 32px;
            }

            .section-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- 3 Banner -->
    <div class="banner-container">
        <div class="banner-slider">
            <div class="slide slide1"></div>
            <div class="slide slide2"></div>
            <div class="slide slide3"></div>
        </div>
    </div>

    <!-- Best Seller -->
    <main class="content-section">

        <h2 class="section-title">
            실시간 베스트셀러
        </h2>

        <div class="products-grid">

            <!-- Product 1: d'Alba -->
            <div class="product-img" style="background-image: url('./product1.jpg');"></div>

            <!-- Product 2: Innisfree -->
            <div class="product-img" style="background-image: url('./product2.jpg');"></div>

            <!-- Product 3: Dr.G -->
            <div class="product-img" style="background-image: url('./product3.jpg');"></div>
            <!-- Product 4: Celimax -->
            <div class="product-img" style="background-image: url('./product4.jpg');"></div>

            <!-- Product 5: CLIO -->
            <div class="product-img" style="background-image: url('./product5.jpg');"></div>
            <!-- Product 6: rom&nd -->
            <div class="product-img" style="background-image: url('./product6.jpg');"></div>

            <!-- Product 7: ANUA -->
            <div class="product-img" style="background-image: url('./product7.jpg');"></div>
</body>
</html>
